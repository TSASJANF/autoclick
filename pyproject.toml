[project]
name = "autoclick"
version = "2.0.0"
description = "屏幕识别自动点击工具：YOLO / OpenCV 模板匹配检测 + 自动点击 + 标注训练一体化"
readme = "README.md"
license = { text = "MIT" }
authors = [ { name = "TSASJANF" } ]
keywords = ["auto-clicker", "yolo", "opencv", "screen-capture", "automation"]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0,<7",
    "PySide6-Fluent-Widgets>=1.5,<2",
    "mss>=9.0.0,<10",
    "ultralytics>=8.0.0,<9",
    "opencv-python>=4.8.0,<5",
    "numpy>=1.24.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
